kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: task-pv-claim
spec:
  accessModes:
    - ReadWriteOnce
  # Empty string, not omitted: without this, clusters with a default
  # StorageClass (e.g. k3s's "local-path") auto-assign it to the claim,
  # which then dynamically provisions its own volume instead of binding to
  # task-pv-volume.yaml - defeating the point of a manually pre-created PV.
  storageClassName: ""
  resources:
    requests:
      storage: 3Gi
