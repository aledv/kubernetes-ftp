# hostPath ties this volume to a single node's local disk - fine for a
# single-node demo cluster (minikube/kind/Docker Desktop), not suitable for
# a real multi-node cluster (see ftp-deployment.yaml replicas note).
kind: PersistentVolume
apiVersion: v1
metadata:
  name: task-pv-volume
  labels:
    type: local
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  # Empty string, not omitted: forces static binding to this PV instead of
  # matching whatever StorageClass a cluster sets as default (e.g. k3s ships
  # "local-path" as default, which would otherwise dynamically provision a
  # separate volume for the claim and leave this PV unused - see
  # task-pv-claim.yaml).
  storageClassName: ""
  hostPath:
    path: "/tmp/data"
