apiVersion: v1
kind: Service
metadata:
  name: my-ftp-service
  labels:
    app: my-ftp
spec:
  type: NodePort
  ports:
    - name: ftp-control
      port: 21
      targetPort: 21
      nodePort: 30080
    # Passive-mode data channel ports. These MUST be the same numbers as
    # PASV_MIN_PORT/PASV_MAX_PORT in ftp-deployment.yaml AND as containerPort
    # there, with port == targetPort == nodePort here. vsftpd announces the
    # literal port number to the client in the PASV/EPSV response, and the
    # client connects to that number directly - if nodePort differs from the
    # announced port (e.g. NodePort remapped into the 30000-32767 range while
    # vsftpd announces a different internal port), the client tries the wrong
    # port and passive transfers fail with connection refused. Kubernetes
    # NodePort also has no concept of a port *range*, so every port in the
    # PASV range must be listed explicitly here.
    - name: ftp-pasv-31100
      port: 31100
      targetPort: 31100
      nodePort: 31100
    - name: ftp-pasv-31101
      port: 31101
      targetPort: 31101
      nodePort: 31101
    - name: ftp-pasv-31102
      port: 31102
      targetPort: 31102
      nodePort: 31102
    - name: ftp-pasv-31103
      port: 31103
      targetPort: 31103
      nodePort: 31103
    - name: ftp-pasv-31104
      port: 31104
      targetPort: 31104
      nodePort: 31104
    - name: ftp-pasv-31105
      port: 31105
      targetPort: 31105
      nodePort: 31105
    - name: ftp-pasv-31106
      port: 31106
      targetPort: 31106
      nodePort: 31106
    - name: ftp-pasv-31107
      port: 31107
      targetPort: 31107
      nodePort: 31107
    - name: ftp-pasv-31108
      port: 31108
      targetPort: 31108
      nodePort: 31108
    - name: ftp-pasv-31109
      port: 31109
      targetPort: 31109
      nodePort: 31109
    - name: ftp-pasv-31110
      port: 31110
      targetPort: 31110
      nodePort: 31110
  selector:
    app: my-ftp
